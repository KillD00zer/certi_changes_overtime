<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منظومة المتغيرات المكانية</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <img src="../icons/icon48.png" alt="Logo" class="popup-logo">
      <div>
        <h3>منظومة المتغيرات المكانية</h3>
        <p>Google Earth Cadastral Extension</p>
      </div>
    </div>

    <div class="popup-content">
      <div id="parcel-status-card" class="status-card">
        <div class="status-label">حالة المعاملة الحالية:</div>
        <div id="status-name" class="status-value">لا توجد معاملة نشطة</div>
        <div id="status-details" class="status-sub">اضغط بالأسفل لفتح اللوحة الجانبية وتحميل ملف مساحي</div>
      </div>

      <div class="popup-actions">
        <button id="btn-open-sidepanel" class="btn btn-primary">
          <span>📂 فتح اللوحة الجانبية (SidePanel)</span>
        </button>
        <button id="btn-open-earth" class="btn btn-secondary">
          <span>🌍 فتح موقع Google Earth</span>
        </button>
        <button id="btn-reset" class="btn btn-outline-danger" style="display: none;">
          <span>🗑️ مسح المعاملة وبدء طلب جديد</span>
        </button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
